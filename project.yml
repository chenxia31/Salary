name: SalaryTicker
options:
  bundleIdPrefix: com.openclaw
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SDKROOT: macosx
    SUPPORTED_PLATFORMS: macosx
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    CODE_SIGN_IDENTITY: "-"

targets:
  SalaryTickerCore:
    type: library.static
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Core
    settings:
      base:
        PRODUCT_NAME: SalaryTickerCore
        DEFINES_MODULE: YES
        SDKROOT: macosx
        SUPPORTED_PLATFORMS: macosx
        MACOSX_DEPLOYMENT_TARGET: "14.0"

  SalaryTickerFeatures:
    type: library.static
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Features
    dependencies:
      - target: SalaryTickerCore
    settings:
      base:
        PRODUCT_NAME: SalaryTickerFeatures
        DEFINES_MODULE: YES
        SDKROOT: macosx
        SUPPORTED_PLATFORMS: macosx
        MACOSX_DEPLOYMENT_TARGET: "14.0"

  SalaryTicker:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App
      - path: Resources/Assets.xcassets
      - path: Resources/AppIcon.icns
      - path: Resources/AppLogo.png
      - path: Resources/alipay_qr.jpg
      - path: Resources/wechat_qr.jpg
    dependencies:
      - target: SalaryTickerCore
      - target: SalaryTickerFeatures
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openclaw.salaryticker
        PRODUCT_NAME: SalaryTicker
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        SDKROOT: macosx
        SUPPORTED_PLATFORMS: macosx
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_IDENTITY: "-"

  SalaryTickerTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
    dependencies:
      - target: SalaryTickerCore
    settings:
      base:
        SDKROOT: macosx
        SUPPORTED_PLATFORMS: macosx
        MACOSX_DEPLOYMENT_TARGET: "14.0"

schemes:
  SalaryTicker:
    build:
      targets:
        SalaryTicker: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SalaryTickerTests
